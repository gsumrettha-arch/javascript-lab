<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>

    <style>
        .slider {
            width: 60%;
            margin: auto;
            position: relative;
            overflow: hidden;
        }

        .slides {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .slides img {
            width: 100%;
            flex-shrink: 0;
        }

        .slider button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            cursor: pointer;
        }

        #prevBtn {
            left: 10px;
        }

        #nextBtn {
            right: 10px;
        }
    </style>
</head>

<body>

    <div class="slider">

        <div class="slides">

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRG9NBLVy_0IhwmJ3UULPB6DIhsyLZLGxLxvPicCL5Aiw&s=10">

            <img src="https://img1.hscicdn.com/image/upload/f_auto,t_ds_w_1200,q_60/lsci/db/PICTURES/CMS/398200/398295.jpg"
                 alt="Image 2">

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRWq7bDNTijI7w-VzNaVvqIm4WrICzmA5Zv__CcQtyrOg&s=10"
                 alt="Image 3">

        </div>

        <button id="prevBtn">Previous</button>
        <button id="nextBtn">Next</button>

    </div>

    <script>

        let currentIndex = 0;

        const slides = document.querySelector(".slides");
        const totalImages = document.querySelectorAll(".slides img").length;

        const nextBtn = document.getElementById("nextBtn");
        const prevBtn = document.getElementById("prevBtn");

        function showImage() {
            slides.style.transform =
                `translateX(-${currentIndex * 100}%)`;
        }

        nextBtn.addEventListener("click", () => {

            if (currentIndex < totalImages - 1) {
                currentIndex++;
                showImage();
            }

        });

        prevBtn.addEventListener("click", () => {

            if (currentIndex > 0) {
                currentIndex--;
                showImage();
            }

        });

    </script>

</body>
</html>
